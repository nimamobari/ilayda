<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030610"><meta name="robots" content="noindex,nofollow"><meta name="description" content="İlayda için küçük bir hediye."><title>İlayda.</title><style>
:root{color-scheme:dark;--paper:#f4e8e6;--muted:#b0aec0;--smoke-color:#78c9ef}
*{box-sizing:border-box}html{min-width:280px;background:#030610}body{margin:0;background:#030610;color:var(--paper);font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}::selection{background:#474d7b;color:white}
.gift{margin:0}.gift-cover{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:40px 24px;background:radial-gradient(ellipse at 50% 50%,#19203665,transparent 68%),#030610}
.gift-cover::-webkit-details-marker{display:none}.gift-cover::marker{content:''}.gift[open]>.gift-cover{display:none}
.invitation{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:450px;gap:0}
.recipient{font-size:clamp(58px,9vw,88px);font-style:italic;line-height:1.15;letter-spacing:-.06em;margin-bottom:30px}
.intro-copy{display:block;max-width:390px;font-size:20px;line-height:1.75;color:#d1cad9;margin:0}
.intro-copy+.intro-copy{margin-top:13px}
.dedication{display:block;font-size:21px;font-style:italic;line-height:1.6;color:#e3c1d3;margin-top:23px}
.open-gift{display:inline-flex;align-items:center;justify-content:center;min-height:50px;min-width:175px;margin-top:34px;padding:13px 29px;border:1px solid #a7859d;border-radius:4px;background:#d6a4c00a;color:#f4e8e6;font:15px/1.5 Arial,Helvetica,sans-serif;letter-spacing:.035em;transition:background .2s,border-color .2s}
.gift-cover:hover .open-gift{background:#d6a4c01c;border-color:#e4bed5}.gift-cover:focus-visible{outline:none}.gift-cover:focus-visible .open-gift{outline:2px solid #d0e9ff;outline-offset:6px}
.experience{min-height:760px;min-height:max(760px,100svh);position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% 47%,#18263e35,transparent 57%),radial-gradient(ellipse at 50% 89%,#06122270,transparent 55%),#030610}
.heading{position:absolute;top:37px;left:20px;right:20px;text-align:center;z-index:3;pointer-events:none}
h1{font-size:clamp(65px,7.3vw,103px);font-weight:400;font-style:italic;line-height:1.1;letter-spacing:-.065em;margin:0;text-shadow:0 3px 25px #060812}h1:focus{outline:none}
.heading-line{display:block;width:1px;height:30px;margin:20px auto 0;background:linear-gradient(#d1b2c880,transparent)}
.stage{position:absolute;inset:68px 0 65px;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.world{position:relative;width:min(110vw,calc((100svh - 100px)*.824),700px);aspect-ratio:700/850;flex:none;isolation:isolate}
.scene-svg,.mist-svg{display:block;width:100%;height:auto;overflow:visible;pointer-events:none}.mist-svg{height:100%}
.rose-plane,.smoke-plane{position:absolute;inset:0;pointer-events:none;contain:layout style;backface-visibility:hidden}
.rose-plane{z-index:1}.smoke-rear{z-index:0;opacity:.88}.smoke-near{z-index:2;opacity:.5}.aura{opacity:.65}.blue-aura{opacity:.65}.dewdrops{opacity:.8}.burst{display:none}
.gift[open] .rose-plane,.gift[open] .smoke-plane{will-change:transform,opacity}
.gift[open] .rose-plane{animation:rose-float 10s ease-in-out infinite}
.gift[open] .smoke-rear{animation:smoke-rear 18s ease-in-out infinite}
.gift[open] .smoke-near{animation:smoke-near 22s ease-in-out infinite}
.gift[open] .world{animation:gift-arrive 1.5s ease both}
.gift[open] .reading{animation:gift-arrive 1.1s .5s ease both}
.reading{position:absolute;left:24px;right:24px;bottom:max(38px,env(safe-area-inset-bottom));text-align:center;z-index:3;pointer-events:none}
.quote{margin:0 auto;max-width:520px}.quote p{margin:0;font-size:clamp(20px,2.1vw,29px);line-height:1.5;letter-spacing:-.018em}.quote p span{display:block}.quote p span:last-child{font-style:italic;color:#cdb5c9}.quote footer{font:12px/1.5 Arial,Helvetica,sans-serif;letter-spacing:.1em;color:#989bad;margin-top:13px}
.paused .rose-plane,.paused .smoke-plane{animation-play-state:paused!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@keyframes rose-float{0%,100%{transform:translate3d(0,3px,0)}50%{transform:translate3d(0,-5px,0)}}
@keyframes smoke-rear{0%,100%{transform:translate3d(-8px,14px,0);opacity:.65}50%{transform:translate3d(10px,-24px,0);opacity:1}}
@keyframes smoke-near{0%,100%{transform:translate3d(9px,8px,0);opacity:.35}50%{transform:translate3d(-12px,-19px,0);opacity:.65}}
@keyframes gift-arrive{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@media(max-width:600px){.experience{min-height:720px;min-height:max(720px,100svh)}.heading{top:31px}h1{font-size:72px}.heading-line{height:22px;margin-top:12px}.world{width:116vw}.stage{inset:70px 0 80px}.reading{bottom:max(40px,env(safe-area-inset-bottom))}.quote p{font-size:22px}.quote footer{margin-top:11px}.smoke-near{display:none}.gift[open] .rose-plane{animation-duration:12s}.gift[open] .smoke-rear{animation-duration:22s}.intro-copy{font-size:19px;max-width:335px}.recipient{font-size:67px}.dedication{font-size:20px}}
@media(max-width:360px){h1{font-size:64px}.quote p{font-size:20px}.world{width:118vw}.intro-copy{font-size:18px}.recipient{font-size:60px}}

<script>
(() => {
 'use strict';
 const gift = document.getElementById('gift');
 const scene = document.getElementById('experience');
 const title = document.getElementById('title');
 function updateVisibility() {
  scene.classList.toggle('paused', document.hidden || !gift.open);
 }
 gift.addEventListener('toggle', () => {
  updateVisibility();
  if (gift.open) title.focus({preventScroll:true});
 });
 document.addEventListener('visibilitychange', updateVisibility);
 window.addEventListener('pagehide', () => scene.classList.add('paused'));
 window.addEventListener('pageshow', updateVisibility);
 updateVisibility();
})();
</script>
